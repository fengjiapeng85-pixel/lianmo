<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>联摩汽配 · 产品目录 Catalogue</title>
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{
  --graphite:#1B2027;
  --graphite-2:#232A33;
  --graphite-3:#2C3540;
  --ink:#20242B;
  --paper:#F2F3F0;
  --card:#FFFFFF;
  --line:#E1E4DF;
  --amber:#E8860C;
  --amber-deep:#C96E06;
  --amber-soft:#FCEAD3;
  --red:#B3261E;
  --green:#3E7A4E;
  --muted:#66707C;
  --muted-2:#9AA3AD;
  --white:#FFFFFF;
  --shadow:0 1px 2px rgba(20,25,30,.05),0 8px 24px -12px rgba(20,25,30,.18);
  --radius:14px;
  --header-h:56px;
  --toolbar-h:56px;
  --display:'Barlow Condensed','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --body:'Noto Sans SC','Noto Sans','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --mono:ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--body);
  color:var(--ink);
  background:var(--paper);
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit}
a{color:inherit;text-decoration:none}

/* ===== Header ===== */
.site-header{
  position:sticky;top:0;z-index:60;
  height:var(--header-h);
  background:rgba(27,32,39,.96);
  backdrop-filter:blur(10px);
  color:#fff;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.header-inner{
  max-width:1200px;margin:0 auto;height:100%;
  padding:0 18px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{
  width:34px;height:34px;flex:0 0 auto;border-radius:9px;
  background:linear-gradient(140deg,var(--amber),var(--amber-deep));
  display:flex;align-items:center;justify-content:center;
}
.brand-mark svg{width:20px;height:20px;stroke:#fff}
.brand-name{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.4px;line-height:1.1;white-space:nowrap}
.brand-name small{display:block;font-family:var(--body);font-weight:500;font-size:10px;letter-spacing:2.4px;color:rgba(255,255,255,.55);text-transform:uppercase}
.lang-switch{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.08);border-radius:999px;padding:3px}
.lang-btn{
  min-height:30px;min-width:40px;padding:0 10px;border-radius:999px;
  font-size:12.5px;font-weight:700;color:rgba(255,255,255,.62);
  letter-spacing:.4px;transition:.18s;
}
.lang-btn.active{background:var(--amber);color:#fff}

/* ===== Toolbar: search + tabs ===== */
.toolbar{
  position:sticky;top:var(--header-h);z-index:50;
  background:rgba(242,243,240,.94);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.toolbar-inner{max-width:1200px;margin:0 auto;padding:10px 18px}
.search-box{
  position:relative;display:flex;align-items:center;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  transition:.18s;box-shadow:0 1px 2px rgba(20,25,30,.03);
}
.search-box:focus-within{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.search-box svg{position:absolute;left:12px;width:18px;height:18px;stroke:var(--muted-2);pointer-events:none}
.search-box input{
  width:100%;height:44px;padding:0 44px 0 40px;border:none;background:none;
  font-size:14.5px;color:var(--ink);outline:none;
}
.search-box input::placeholder{color:var(--muted-2)}
.search-clear{
  position:absolute;right:6px;width:34px;height:34px;border-radius:9px;
  display:none;align-items:center;justify-content:center;color:var(--muted);
}
.search-clear.show{display:flex}
.search-clear:hover{background:var(--paper);color:var(--ink)}
.search-clear svg{width:16px;height:16px;stroke:currentColor;position:static}

.cat-tabs{
  display:flex;flex-wrap:nowrap;gap:8px;margin-top:10px;
  overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
  scrollbar-width:thin;scrollbar-color:#c8cbc4 transparent;padding-bottom:4px;
}
.cat-tabs::-webkit-scrollbar{height:5px}
.cat-tabs::-webkit-scrollbar-track{background:transparent}
.cat-tabs::-webkit-scrollbar-thumb{background:#c8cbc4;border-radius:3px}
.cat-tab{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;
  height:38px;padding:0 14px;border-radius:999px;
  background:var(--card);border:1px solid var(--line);
  font-size:13.5px;font-weight:600;color:var(--ink);
  transition:.15s;white-space:nowrap;
}
.cat-tab:hover{border-color:var(--amber);color:var(--amber-deep)}
.cat-tab.active{background:var(--graphite);border-color:var(--graphite);color:#fff}
.cat-tab .cnt{
  font-family:var(--display);font-size:12.5px;font-weight:600;
  background:rgba(20,25,30,.07);color:var(--muted);
  border-radius:999px;padding:0 7px;line-height:18px;
}
.cat-tab.active .cnt{background:rgba(255,255,255,.16);color:#fff}

/* ===== Hero ===== */
.hero{
  position:relative;overflow:hidden;color:#fff;
  background:var(--graphite);
}
.hero-bg{
  position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(18,22,28,.92) 0%,rgba(18,22,28,.55) 55%,rgba(18,22,28,.35) 100%),
              url('https://aka.doubaocdn.com/s/0UPnQQHQjV') center/cover no-repeat;
}
.hero-bg::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 60%,rgba(27,32,39,.9) 100%);
}
.hero-inner{
  position:relative;z-index:2;max-width:1200px;margin:0 auto;
  padding:64px 18px 88px;
}
.hero-kicker{
  display:inline-flex;align-items:center;gap:8px;
  font-size:12px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;
  color:var(--amber);margin-bottom:16px;
}
.hero-kicker::before{content:"";width:26px;height:2px;background:var(--amber)}
.hero h1{
  font-family:var(--display);font-weight:700;
  font-size:clamp(40px,7.5vw,72px);line-height:1.02;letter-spacing:.5px;
}
.hero h1 .hl{color:var(--amber)}
.hero-sub{
  margin-top:14px;max-width:640px;
  font-size:clamp(14px,2vw,17px);color:rgba(255,255,255,.82);font-weight:400;
}
.hero-sub em{font-style:normal;color:rgba(255,255,255,.55);font-size:.92em}
.hero-stats{
  display:flex;flex-wrap:wrap;gap:0;margin-top:36px;
  border:1px solid rgba(255,255,255,.14);border-radius:var(--radius);
  background:rgba(255,255,255,.05);backdrop-filter:blur(6px);
  overflow:hidden;max-width:560px;
}
.stat{flex:1 1 0;min-width:120px;padding:16px 20px;border-right:1px solid rgba(255,255,255,.12)}
.stat:last-child{border-right:none}
.stat b{font-family:var(--display);font-weight:700;font-size:34px;color:var(--amber);line-height:1}
.stat span{display:block;margin-top:5px;font-size:12px;letter-spacing:1px;color:rgba(255,255,255,.7);text-transform:uppercase}

/* ===== Catalog ===== */
.catalog{max-width:1200px;margin:0 auto;padding:28px 18px 60px}
.section-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  margin-bottom:18px;
}
.section-head h2{font-family:var(--display);font-weight:600;font-size:26px;letter-spacing:.3px}
.section-head .count{font-size:13.5px;color:var(--muted);font-weight:500;white-space:nowrap}
.result-line{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);margin-bottom:16px}
.result-line b{font-family:var(--display);font-size:18px;color:var(--amber-deep)}

.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:16px;
}

/* parts-tag card */
.card{
  position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;display:flex;flex-direction:column;gap:10px;
  transition:transform .16s,box-shadow .16s,border-color .16s;
  cursor:pointer;overflow:hidden;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#d4d8d2}
.card:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.card::before{
  content:"";position:absolute;top:14px;right:14px;width:10px;height:10px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#6d7681 0%,#2c3540 70%);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.25),0 1px 2px rgba(0,0,0,.3);
  z-index:2;
}
.card-img{
  margin:-16px -16px 0 -16px;height:150px;overflow:hidden;position:relative;
  background:#e8e9e5;
}
.card-img img{width:100%;height:100%;object-fit:cover;display:block}
.card-img .img-tag{
  position:absolute;bottom:8px;left:8px;
  background:rgba(27,32,39,.78);color:#fff;
  font-size:10px;font-weight:600;letter-spacing:.5px;
  padding:2px 8px;border-radius:5px;
}
.modal-img{
  width:100%;height:220px;object-fit:cover;border-radius:12px;
  margin-bottom:14px;background:#e8e9e5;display:block;
}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chip{
  display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:6px;
  font-size:11px;font-weight:700;letter-spacing:.3px;
}
.cat-chip{background:var(--amber-soft);color:var(--amber-deep)}
.unit-chip{background:#EEF0F4;color:var(--muted);font-family:var(--display);letter-spacing:.6px}
.card-icon{
  width:52px;height:52px;border-radius:12px;flex:0 0 auto;
  background:linear-gradient(145deg,#2C3540,#1B2027);
  display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1);
}
.card-icon svg{width:28px;height:28px;stroke:var(--amber)}
.card-name{font-size:16.5px;font-weight:700;line-height:1.3}
.card-name-en{font-size:11.5px;color:var(--muted);letter-spacing:.3px;text-transform:uppercase;font-weight:600}
.code-plate{
  margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--graphite);border-radius:9px;padding:9px 12px;
}
.code-plate .cl{font-size:10px;color:rgba(255,255,255,.5);letter-spacing:1.4px;text-transform:uppercase}
.code-plate .cv{
  font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--amber);
  word-break:break-all;text-align:right;
}
.card-meta{display:flex;flex-direction:column;gap:5px}
.meta-row{display:flex;align-items:baseline;gap:8px;font-size:12px;color:var(--ink)}
.meta-row .ml{flex:0 0 auto;color:var(--muted-2);font-size:11px;letter-spacing:.6px}
.meta-row .mv{font-size:12px;line-height:1.45;min-width:0}
.meta-row .mv .seg{display:inline-block;margin:0 2px 2px 0;padding:1px 7px;background:#F0F1EE;border-radius:5px;font-size:11.5px;color:#3d454f}

.empty{
  display:none;flex-direction:column;align-items:center;gap:12px;
  padding:60px 20px;text-align:center;color:var(--muted);
}
.empty.show{display:flex}
.empty svg{width:44px;height:44px;stroke:var(--muted-2)}
.empty b{font-size:16px;color:var(--ink)}
.empty p{font-size:13px;max-width:380px}

/* ===== Footer ===== */
.site-footer{background:var(--graphite);color:rgba(255,255,255,.7);margin-top:8px}
.footer-inner{max-width:1200px;margin:0 auto;padding:40px 18px 32px}
.footer-brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.footer-brand .brand-mark{width:30px;height:30px}
.footer-brand b{font-family:var(--display);font-size:19px;color:#fff;letter-spacing:.4px}
.footer-tag{font-size:12.5px;color:rgba(255,255,255,.55);max-width:640px;line-height:1.7;margin:0}
.footer-langs{
  display:flex;flex-wrap:wrap;gap:6px;margin-top:16px;
}
.footer-langs span{font-size:11px;letter-spacing:.6px;color:rgba(255,255,255,.45);background:rgba(255,255,255,.06);padding:3px 9px;border-radius:6px}
.footer-note{margin-top:22px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1);font-size:11.5px;color:rgba(255,255,255,.38)}

/* ===== Modal ===== */
.modal-mask{
  position:fixed;inset:0;z-index:100;background:rgba(18,22,28,.55);
  display:none;align-items:flex-end;justify-content:center;
  backdrop-filter:blur(3px);
}
.modal-mask.show{display:flex}
.modal{
  width:100%;max-width:680px;max-height:88vh;overflow-y:auto;
  background:var(--card);border-radius:20px 20px 0 0;
  padding:22px 20px 26px;position:relative;animation:slideUp .24s ease;
}
@keyframes slideUp{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media(min-width:720px){
  .modal-mask{align-items:center}
  .modal{border-radius:20px;margin:0 16px}
}
.modal-close{
  position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:11px;
  display:flex;align-items:center;justify-content:center;color:var(--muted);
  background:var(--paper);
}
.modal-close:hover{color:var(--ink)}
.modal-close svg{width:18px;height:18px;stroke:currentColor}
.modal-cat{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:7px;background:var(--amber-soft);color:var(--amber-deep);font-size:12px;font-weight:700}
.modal h3{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.15;margin:14px 0 2px}
.modal .m-code{font-family:var(--mono);font-size:13px;color:var(--muted)}
.modal .m-langs{margin-top:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.m-langs .row{display:flex;align-items:baseline;gap:12px;padding:10px 14px;font-size:13.5px}
.m-langs .row + .row{border-top:1px solid var(--line)}
.m-langs .row .lg{flex:0 0 74px;font-size:11px;font-weight:700;color:var(--muted-2);letter-spacing:.6px;text-transform:uppercase}
.m-langs .row .nm{font-weight:600}
.m-grid{margin-top:16px;display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:560px){.m-grid{grid-template-columns:1fr 1fr}}
.m-cell{border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:#FAFBF9}
.m-cell .t{font-size:11px;color:var(--muted-2);letter-spacing:.6px;margin-bottom:3px}
.m-cell .v{font-size:13.5px;font-weight:600;word-break:break-all}
.m-cell .v .seg{display:inline-block;margin:2px 3px 0 0;padding:2px 9px;background:var(--paper);border:1px solid var(--line);border-radius:7px;font-size:12px;font-weight:500;color:#3d454f}
.modal-nav{margin-top:18px;display:flex;gap:10px}
.modal-nav button{
  flex:1;height:44px;border-radius:11px;font-size:13.5px;font-weight:700;
  background:var(--paper);color:var(--ink);border:1px solid var(--line);
  transition:.15s;
}
.modal-nav button:hover{border-color:var(--amber);color:var(--amber-deep)}
.modal-nav button:disabled{opacity:.4;cursor:default;border-color:var(--line);color:var(--muted-2)}

/* ===== Back to top ===== */
.to-top{
  position:fixed;right:18px;bottom:22px;z-index:40;
  width:46px;height:46px;border-radius:14px;background:var(--graphite);color:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transform:translateY(8px);
  transition:.2s;
}
.to-top.show{opacity:1;pointer-events:auto;transform:none}
.to-top svg{width:20px;height:20px;stroke:currentColor}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
@media(max-width:560px){
  .brand-name{font-size:18px}
  .brand-name small{font-size:9px;letter-spacing:1.8px}
  .hero-inner{padding:44px 18px 66px}
  .stat{padding:13px 14px}
  .stat b{font-size:28px}
  .section-head h2{font-size:22px}
}

/* Hide Netlify badge */
a[class*="netlify"],a[href*="netlify.com"],div[class*="netlify"],iframe[src*="netlify"]{display:none!important}
</style>
</head>

<!-- ===== Header ===== -->
<header class="site-header">
  <div class="header-inner">
    <div class="brand" aria-label="LIANMO AUTO PARTS">

        <circle cx="11" cy="11" r="6.5"/>

<!-- ===== Hero ===== -->

</section>

<!-- ===== Catalog ===== -->
<div id="loadingTip" style="display:none;position:fixed;inset:0;background:rgba(255,255,255,.95);z-index:9999;align-items:center;justify-content:center;flex-direction:column;gap:16px">
  <div style="width:40px;height:40px;border:3px solid #e0e0e0;border-top-color:#E8AA36;border-radius:50%;animation:spin 1s linear infinite"></div>
  <p style="color:#666;font-size:14px;letter-spacing:.5px">正在加载产品数据…</p>
</div>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>
<main class="catalog">
  <div class="section-head">
    <h2 id="secTitle">全部产品</h2>
    <span class="count" id="secCount"></span>
  </div>
  <div class="result-line" id="resultLine"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="6.5"/>
      <path d="M16 16l4.5 4.5M8 11h6"/>
    </svg>
    <b data-i18n="noResult">未找到匹配的产品</b>
    <p data-i18n="noResultHint">请尝试其他关键词，或切换分类查看全部产品。</p>
  </div>
</main>

<!-- ===== Footer ===== -->
<footer class="site-footer">
  <div class="footer-inner">
    <p class="footer-tag" data-i18n="footerTag">汽车配件产品目录 | Catalogue des Pièces Automobiles | Auto Parts Catalog</p>
    <div class="footer-langs">
      <span data-i18n="fLangZh">中文 · 简体</span>
      <span data-i18n="fLangEn">English</span>
      <span data-i18n="fLangFr">Français</span>
    </div>
    <p class="footer-note" data-i18n="footerNote">产品信息与适用车型以最新报价为准；如需获取完整价目表或下单，请联系供应商确认。</p>
  </div>

function translateModels(text, lang){
  if(!text || lang==='zh') return text;
  var result = text;
  for(var i=0;i<MODEL_TRANS.length;i++){
    var term = MODEL_TRANS[i][0];
    if(result.indexOf(term)!==-1){
      result = result.split(term).join(' '+MODEL_TRANS[i][lang==='en'?1:2]+' ');
    }
  }
  result = result.replace(/\s+/g,' ').replace(/\s*\/\s*/g,'/').trim();
  return result;
}

      state.cat = parseInt(b.getAttribute('data-cat'), 10);

      window.scrollTo({top: document.getElementById('catalog').offsetTop - 140, behavior:'smooth'});

function currentList(){
  var q = norm(state.query);
  var out = [];
  CATALOG_DATA.forEach(function(c, ci){

      if(q){
        var hay = norm([it.code, it.oe, it.zh, it.en, it.fr, it.models].join(' '));
        if(hay.indexOf(q) === -1) return;

  });

}

  secCount.textContent = total + ' ' + I18N[state.lang].items;
  if(state.query){
    resultLine.textContent = state.list.length + ' / ' + total + ' ' + I18N[state.lang].items;
  } else {
    resultLine.textContent = '';
  }

  if(!state.list.length){
    grid.innerHTML = '';
    empty.classList.add('show');
    return;
  }
  empty.classList.remove('show');

  var html = '';
  state.list.forEach(function(entry, idx){
    var c = CATALOG_DATA[entry.ci], it = entry.it;
    var models = splitModels(translateModels(it.models, state.lang));
    var modelHtml = models.slice(0,4).map(function(m){return '<span class="seg">'+esc(m)+'</span>'}).join('');
    var more = models.length>4 ? '<span style="font-size:11px;color:var(--muted-2)">+'+(models.length-4)+'</span>' : '';
    var primary = it[state.lang] || it.zh;
    var secondary = state.lang==='en' ? (it.zh) : (it.en || it.zh);
    var imgInfo = getImg(it.code, entry.ci);
    var imgTag = imgInfo.real ? '' : '<span class="img-tag">'+(state.lang==='zh'?'分类图':state.lang==='fr'?'Illustration':'Category')+'</span>';
    html += '<article class="card" tabindex="0" data-idx="'+idx+'" role="button">'    + '<div class="card-img"><img src="'+esc(imgInfo.url)+'" alt="'+esc(primary)+'" loading="lazy">'+imgTag+'</div>'
      + '<div class="card-top">'
      +   '<span class="chip cat-chip">'+esc(catName(c))+'</span>'
      +   '<span class="chip unit-chip">'+esc(it.unit||'—')+'</span>'
      + '</div>'
      + '<div><h3 class="card-name">'+esc(primary)+'</h3>'
      + '<p class="card-name-en">'+esc(secondary)+'</p></div>'
      + '<div class="code-plate"><span class="cl">'+I18N[state.lang].code+'</span><span class="cv">'+esc(it.code)+'</span></div>'
      + '<div class="card-meta">'
      +   (it.oe ? '<div class="meta-row"><span class="ml">'+I18N[state.lang].oe+'</span><span class="mv">'+esc(it.oe)+'</span></div>' : '')
      +   (modelHtml ? '<div class="meta-row"><span class="ml">'+I18N[state.lang].models+'</span><span class="mv">'+modelHtml+more+'</span></div>' : '')
      + '</div>'
      + '<div class="card-see" style="font-size:12px;color:var(--amber-deep);font-weight:600;letter-spacing:.3px">'+I18N[state.lang].seeMore+'</div>'
      + '</article>';
  });
  grid.innerHTML = html;

  $$('.card').forEach(function(card){
    function open(){ openModal(parseInt(card.getAttribute('data-idx'),10)) }
    card.addEventListener('click', open);
    card.addEventListener('keydown', function(e){
      if(e.key==='Enter' || e.key===' '){e.preventDefault(); open();}
    });
  });
}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g, function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}

/* ===== 详情弹层 ===== */
function openModal(idx){
  if(idx<0 || idx>=state.list.length) return;
  state.current = idx;
  var e = state.list[idx], c = CATALOG_DATA[e.ci], it = e.it;
  var mImg = getImg(it.code, e.ci);
  var mImgEl = $('#mImg');
  if(mImg.url){ mImgEl.src = mImg.url; mImgEl.alt = it[state.lang]||it.zh; mImgEl.style.display='block'; }
  else { mImgEl.style.display='none'; }
  $('#mCat').textContent = catName(c);
  $('#mName').textContent = it[state.lang] || it.zh;
  $('#mCode').textContent = it.code;
  $('#mZh').textContent = it.zh || '—';
  $('#mEn').textContent = it.en || '—';
  $('#mFr').textContent = it.fr || '—';
  $('#mUnit').textContent = it.unit || '—';
  $('#mSeq').textContent = it.seq || '—';
  var models = splitModels(translateModels(it.models, state.lang));
  $('#mModels').innerHTML = models.length ? models.map(function(m){return '<span class="seg">'+esc(m)+'</span>'}).join('') : '—';
  $('#mPrev').disabled = idx===0;
  $('#mNext').disabled = idx===state.list.length-1;
  $('#modalMask').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeModal(){
  $('#modalMask').classList.remove('show');
  document.body.style.overflow = '';
}
$('#modalClose').addEventListener('click', closeModal);
$('#modalMask').addEventListener('click', function(e){ if(e.target===this) closeModal(); });
$('#mPrev').addEventListener('click', function(){ if(state.current>0) openModal(state.current-1) });
$('#mNext').addEventListener('click', function(){ if(state.current<state.list.length-1) openModal(state.current+1) });
document.addEventListener('keydown', function(e){
  if(!$('#modalMask').classList.contains('show')) return;
  if(e.key==='Escape') closeModal();
  if(e.key==='ArrowLeft') $('#mPrev').disabled||openModal(state.current-1);
  if(e.key==='ArrowRight') $('#mNext').disabled||openModal(state.current+1);
});

/* ===== 语言切换 ===== */
function applyLang(lang){
  state.lang = lang;
  try{ localStorage.setItem('lm_lang', lang) }catch(e){}
  $$('.lang-btn').forEach(function(b){
    var on = b.getAttribute('data-lang')===lang;
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', on?'true':'false');
  });
  // 静态文案
  Object.keys(I18N[lang]).forEach(function(k){
    if(k==='searchPh') return;
    $$('[data-i18n="'+k+'"]').forEach(function(el){ el.textContent = I18N[lang][k] });
  });
  $('#search').placeholder = I18N[lang].searchPh;
  document.documentElement.lang = lang==='zh'?'zh-CN':lang;
  renderTabs(); renderGrid();
}
$$('.lang-btn').forEach(function(b){
  b.addEventListener('click', function(){ applyLang(b.getAttribute('data-lang')) });
});

/* ===== 搜索 ===== */
var searchInput = $('#search');
searchInput.addEventListener('input', function(){
  state.query = searchInput.value.trim();
  $('#searchClear').classList.toggle('show', !!state.query);
  renderGrid();
});
$('#searchClear').addEventListener('click', function(){
  searchInput.value=''; state.query=''; $('#searchClear').classList.remove('show'); renderGrid();
  searchInput.focus();
});

/* ===== 返回顶部 ===== */
var toTop = $('#toTop');
window.addEventListener('scroll', function(){
  toTop.classList.toggle('show', window.scrollY > 600);
}, {passive:true});
toTop.addEventListener('click', function(){ window.scrollTo({top:0, behavior:'smooth'}) });

/* ===== 初始化 ===== */
function init(){
  var saved = null;
  try{ saved = localStorage.getItem('lm_lang') }catch(e){}
  var detected = (navigator.language||'').toLowerCase().indexOf('fr')===0 ? 'fr' : 'zh';
  applyLang(saved && ['zh','en','fr'].indexOf(saved)>-1 ? saved : detected);
}
function loadData(){
  var loading = document.getElementById('loadingTip');
  if(loading) loading.style.display='flex';
  fetch('catalog.json',{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(data){
      CATALOG_DATA = data;
      if(loading) loading.style.display='none';
      init();
    })
    .catch(function(err){
      console.error('Failed to load catalog.json:', err);
      if(loading){
        loading.innerHTML = '<div style="text-align:center"><p style="color:#c0392b;font-size:16px;margin-bottom:8px">数据加载失败</p><p style="color:#666;font-size:13px">请确保 catalog.json 与 index.html 在同一目录，并通过 Web 服务器访问（部署到 Netlify 后正常）。</p></div>';
      }
    });
}
loadData();
</script>
</body>
</html>
